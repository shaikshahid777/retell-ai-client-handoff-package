<style>
.b{fill:url(#bar);transform-box:fill-box;transform-origin:center;animation:wave 1.4s ease-in-out infinite alternate}
@keyframes wave{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.orb1{animation:float 7s ease-in-out infinite alternate}
.orb2{animation:float 9s ease-in-out infinite alternate-reverse}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(-34px,20px)}}
.rise{animation:rise .9s ease-out both}
.rise2{animation:rise .9s ease-out .25s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tg{opacity:0;animation:tg 12s infinite}
@keyframes tg{0%{opacity:0;transform:translateY(6px)}6%{opacity:1;transform:none}30%{opacity:1}36%{opacity:0}100%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
</style>
</defs>
